[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
px-core = { path = "crates/px-core" }
px-expr = { path = "crates/px-expr" }
px-raster = { path = "crates/px-raster" }
px-format = { path = "crates/px-format" }
px-engine = { path = "crates/px-engine" }
px-export = { path = "crates/px-export" }
px-director = { path = "crates/px-director" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
gif = "0.14"
kdl = { version = "6.7", default-features = false, features = ["span"] }
libm = "0.2"
minifb = "0.29"
png = "0.18"

[workspace.lints.rust]
# Library crates additionally `#![forbid(unsafe_code)]`; see docs/engineering/DECISIONS.md D-002.
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
# Code explains itself; doc sections are written only when they carry information (D-007).
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Heap guardrails from clippy.toml are opted into by strict crates only.
disallowed_macros = "allow"
disallowed_types = "allow"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

# Unoptimized LZW and libm made debug exports and golden tests ~20× slower.
[profile.dev.package."*"]
opt-level = 3

[profile.release-assertions]
inherits = "release"
debug-assertions = true
overflow-checks = true
# Tests don't need the last 20 % of speed; skipping LTO halves rebuilds in tools/check.sh.
lto = false
codegen-units = 16
